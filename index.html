<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Red Moon Ninja</title>
<meta name="description" content="Ниндзя Красной Луны: бег по крышам, 4 локации и 4 босса.">
<meta name="theme-color" content="#0a0b16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Red Moon Ninja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:"Russo One";src:url("fonts/RussoOne-Regular.ttf") format("truetype");font-display:block}
html,body{margin:0;height:100%;background:#05050c;color:#ece4d4;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);
  display:flex;align-items:center;justify-content:center}
#game{display:block;touch-action:none;outline:none}
#rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0a0b16;z-index:2;
  font:20px "Russo One","Arial Black",sans-serif;text-align:center;padding:24px}
#rotate svg{width:84px;height:84px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate svg{animation:none}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Игра Red Moon Ninja"></canvas></div>
<div id="rotate">
  <svg viewBox="0 0 64 64" fill="none" stroke="#ece4d4" stroke-width="4" stroke-linecap="round"><rect x="20" y="6" width="24" height="52" rx="5"/><path d="M29 50h6" stroke="#e0383f"/></svg>
  <p>Поверни телефон горизонтально<br><span style="font-size:16px;opacity:.75">Rotate your phone to landscape</span></p>
</div>
<script>window.NINJA_APP=true;</script>
<script src="game.js"></script>
<script>
if(document.fonts)document.fonts.load('20px "Russo One"').catch(function(){});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.Capacitor){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
